# ~/.config/hypr/hypridle.conf — hyprlang format (NOT lua)
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock   # avoid spawning multiple locks
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Turn the display off after 5 minutes.
# GOTCHA: this is a Lua config, so `hyprctl dispatch dpms off` is evaluated as
# Lua (`hl.dispatch(dpms off)` -> syntax error) and silently never fires — the
# same trap as the workspace/close binds. The dispatch MUST be the Lua form
# `hl.dsp.dpms({ action = "disable"|"enable" })`. ("disable" = screen off.)
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'   # screen off
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'    # screen back on
}

# Lock the screen after 10 minutes
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Suspend to RAM after 60 minutes idle.
# Plain `suspend` (not suspend-then-hibernate): this laptop has no resume= on the
# kernel cmdline and only an 8G swapfile, so hibernate isn't wired up. Suspend/
# resume (deep/S3) is proven clean on this hardware. Lid close also suspends via
# systemd-logind independently of this; before_sleep_cmd above locks either way.
listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
