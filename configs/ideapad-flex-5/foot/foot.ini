# ~/.config/foot/foot.ini — minimal Wayland terminal, black background.
# LAPTOP delta vs desktop: dpi-aware=no. The eDP-1 panel is ~157 DPI at scale=1;
# with dpi-aware=yes foot scales the point size by ~157/96 (~1.6x) and text is
# huge. dpi-aware=no maps size to a 96-DPI baseline, matching waybar and the dock.
font=SF Mono:size=12:weight=medium
pad=8x8
dpi-aware=no

[cursor]
style=block
blink=no

[colors-dark]
alpha=1.0
background=000000
foreground=c5c8c6

# 16-color minimal/monochrome-leaning palette
regular0=1d1d1d
regular1=cc6666
regular2=b5bd68
regular3=f0c674
regular4=81a2be
regular5=b294bb
regular6=8abeb7
regular7=c5c8c6
bright0=666666
bright1=d54e53
bright2=b9ca4a
bright3=e7c547
bright4=7aa6da
bright5=c397d8
bright6=70c0b1
bright7=eaeaea

[scrollback]
lines=10000

[mouse-bindings]
# Disable middle-click "primary selection" paste (default is BTN_MIDDLE) so a
# stray middle-click can't dump highlighted text — often a stray command — into
# the terminal. Ctrl+Shift+V (clipboard) still works.
primary-paste=none
