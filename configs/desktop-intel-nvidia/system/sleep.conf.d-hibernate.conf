# systemd sleep drop-in — deploy to /etc/systemd/sleep.conf.d/10-hibernate.conf
#
#   sudo install -Dm644 configs/system/sleep.conf.d-hibernate.conf \
#        /etc/systemd/sleep.conf.d/10-hibernate.conf
#
# Controls `systemctl suspend-then-hibernate`, which hypridle fires at 60min idle.
# AllowSuspendThenHibernate and HibernateMode are already the systemd defaults;
# the one value that matters on this (battery-less) desktop is the delay, since
# the default estimate is battery-based and never fires without one.

[Sleep]
# After suspending to RAM, wait this long, then wake and hibernate to disk.
# Suspend fires at 60min idle (hypridle), so hibernate lands at ~120min total.
HibernateDelaySec=60min
