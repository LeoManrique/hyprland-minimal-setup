# ~/.config/hypr/hypridle.conf — hyprlang format (NOT lua)
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock   # avoid spawning multiple locks
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock the screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the display off after 10 minutes
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
