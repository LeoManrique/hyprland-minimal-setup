# ~/.config/hypr/hypridle.conf — hyprlang format (NOT lua)
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock   # avoid spawning multiple locks
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock the screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the display off after 10 minutes
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend-then-hibernate after 60 minutes idle.
# Suspends to RAM first (instant wake if you come back soon), then after
# HibernateDelaySec (60min, set in /etc/systemd/sleep.conf.d/, deployed from
# configs/system/sleep.conf.d-hibernate.conf) it wakes briefly and hibernates
# to disk for a full power-off — i.e. hibernate at ~120min total idle. Works
# here because swap (32G) > kernel image_size (~26.8G) and resume=UUID is
# already in the kernel cmdline.
listener {
    timeout = 3600
    on-timeout = systemctl suspend-then-hibernate
}
