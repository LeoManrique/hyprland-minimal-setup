# ~/.config/fuzzel/fuzzel.ini — flat black launcher with app icons.
# Ports the old tofi look (black bg, SF Mono, white selection bar,
# red fuzzy-match highlight, sharp 2px #333 border). Docs: man 5 fuzzel.ini

[main]
font = SF Mono:size=13
prompt = "run: "
terminal = foot -e            # apps with Terminal=true in their .desktop launch here
icons-enabled = yes
icon-theme = Papirus-Dark
lines = 12                    # result rows shown
width = 32                    # box width in characters
horizontal-pad = 22
vertical-pad = 18
inner-pad = 8                 # gap between icon/prompt and text
line-height = 20

[colors]
background = 000000ff
text = c5c8c6ff
prompt = ffffffff
input = c5c8c6ff
match = cc6666ff              # fuzzy-matched chars (unselected)
selection = ffffffff          # selection bar bg (white)
selection-text = 000000ff     # selected row text (black)
selection-match = cc6666ff    # fuzzy-matched chars in selected row
border = 333333ff

[border]
width = 2
radius = 0                    # sharp corners
