# ~/.config/hypr/hyprlock.conf — hyprlang format (NOT lua)
# Minimal black lock screen: solid background, clock, hidden input field.
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
}

# Big clock
label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 64
    color = rgba(200, 200, 200, 1.0)
    position = 0, 80
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = JetBrainsMono Nerd Font
    font_size = 16
    color = rgba(120, 120, 120, 1.0)
    position = 0, 10
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 250, 44
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(51, 51, 51, 1.0)
    inner_color = rgba(0, 0, 0, 1.0)
    font_color = rgba(200, 200, 200, 1.0)
    fade_on_empty = false
    placeholder_text = <i>password</i>
    rounding = 0
    check_color = rgba(102, 102, 102, 1.0)
    fail_color = rgba(204, 102, 102, 1.0)
    position = 0, -80
    halign = center
    valign = center
}
